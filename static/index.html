<script>
// ── 상태 ─────────────────────────────────────────────────────
const state = {
  year: new Date().getFullYear(),
  month: new Date().getMonth() + 1,
  view: "calendar",
  calData: null,
  allTasks: [],
  listStatuses: {},   // taskId → { period_key: status }
  filters: { 파트: "", 주기: "", 구분: "", 주인: "" },
  sortCol: "", sortDir: 1,
  modal: { taskId: null, periodKey: null, selectedStatus: null },
  listSearch: "",
  listCycleFilter: "all",
};

// ── API ──────────────────────────────────────────────────────
const api = {
  async get(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async post(url, body) {
    const r = await fetch(url, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async del(url) {
    const r = await fetch(url, { method: "DELETE" });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
};

// ── 유틸 ─────────────────────────────────────────────────────
const WEEKDAYS = ["월", "화", "수", "목", "금", "토", "일"];
const MONTH_KO = ["", "1월", "2월", "3월", "4월", "5월", "6월",
                      "7월", "8월", "9월", "10월", "11월", "12월"];
const STATUS_LABEL = {
  pending: "대기", done: "완료", in_progress: "진행중",
  delayed: "지연", skipped: "건너뜀",
};

function chipClass(task) {
  if (!task) return "chip-other";
  if (task.파트 === "SCM쉐어드파트") return "chip-scm";
  if (task.구분 === "수입") return "chip-imp";
  if (task.구분 === "수출") return "chip-exp";
  return "chip-other";
}

// ① 분류 태그 HTML
function catTag(task) {
  if (!task || !task.구분) return "";
  return `<span class="cat-tag">[${escHtml(task.구분)}]</span>`;
}

// ② 신호등 dot HTML
function sdot(status) {
  return `<span class="sdot sdot-${status || "pending"}"></span>`;
}

// ② 신호등 label (목록용)
function statusLight(status) {
  const cls = status === "in_progress" ? "progress" : (status || "pending");
  return `<span class="status-light">${sdot(status)}${STATUS_LABEL[status] || status}</span>`;
}

// ③ 주기 아이콘
function cycleIcon(c) {
  if (c === "매일")  return `<span class="cyc-icon cyc-daily" title="매일">일</span>`;
  if (c === "매주")  return `<span class="cyc-icon cyc-weekly" title="매주">주</span>`;
  if (c === "매월")  return `<span class="cyc-icon cyc-monthly" title="매월">월</span>`;
  return "";
}

function badgePart(task) {
  if (!task) return "";
  const cls = task.파트 === "SCM쉐어드파트" ? "badge-scm"
            : task.구분 === "수입" ? "badge-imp"
            : task.구분 === "수출" ? "badge-exp" : "";
  return `<span class="badge ${cls}">${task.파트 === "SCM쉐어드파트" ? "SCM" : task.구분 || task.파트}</span>`;
}
function badgeCycle(c) {
  const cls = c === "매일" ? "badge-daily" : c === "매주" ? "badge-weekly" : "badge-monthly";
  return `<span class="badge ${cls}">${c}</span>`;
}
function statusBadge(s) {
  return `<span class="badge s-${s}">${STATUS_LABEL[s] || s}</span>`;
}

// ③ 주차 포맷
function fmtPeriodKey(pk, cycle) {
  if (!pk) return pk;
  if (cycle === "매주") {
    const m = pk.match(/(\d{4})-W(\d+)/);
    if (m) return `${m[1]}년 ${parseInt(m[2])}주차`;
  }
  if (cycle === "매월") return pk.slice(0, 7) + " 월간";
  return pk;
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function escHtml(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

// ── 필터 초기화 ──────────────────────────────────────────────
async function initFilters() {
  const data = await api.get("/api/filters");
  const defs = { 파트: data.파트, 주기: data.주기, 구분: data.구분, 주인: data.주인 };
  const labels = { 파트: "전체 파트", 주기: "전체 주기", 구분: "전체 구분", 주인: "전체 담당자" };
  for (const [key, vals] of Object.entries(defs)) {
    const sel = document.getElementById(`f-${key}`);
    sel.innerHTML = `<option value="">${labels[key]}</option>` +
      vals.map(v => `<option value="${escHtml(v)}">${escHtml(v)}</option>`).join("");
    sel.addEventListener("change", () => {
      state.filters[key] = sel.value;
      sel.classList.toggle("is-active", !!sel.value);
      onFilterChange();
    });
  }
}
function onFilterChange() {
  const hasFilter = Object.values(state.filters).some(v => v);
  const badge = document.getElementById("filter-active-badge");
  if (badge) badge.style.display = hasFilter ? "" : "none";
  if (state.view === "calendar") renderCalendar();
  else if (state.view === "list") renderList();
}

// ── 월간 요약 카드 ───────────────────────────────────────────
function renderMonthSummary(events, tasks) {
  const el = document.getElementById("month-summary");
  if (!el) return;
  // Collect non-daily task statuses across all events this month
  const counts = { total: 0, done: 0, in_progress: 0, delayed: 0, pending: 0 };
  const seen = new Set();
  for (const [, evts] of Object.entries(events)) {
    for (const ev of evts) {
      const t = tasks[ev.task_id];
      if (!t || t.주기 === "매일") continue;
      const key = `${ev.task_id}|${ev.period_key}`;
      if (seen.has(key)) continue;
      seen.add(key);
      counts.total++;
      const s = ev.status || "pending";
      if (s === "done") counts.done++;
      else if (s === "in_progress") counts.in_progress++;
      else if (s === "delayed") counts.delayed++;
      else counts.pending++;
    }
  }
  const pct = counts.total > 0 ? Math.round(counts.done / counts.total * 100) : 0;
  el.innerHTML = `
    <div class="ms-card total">
      <div class="ms-label">전체</div>
      <div class="ms-value"><strong>${counts.total}</strong><span class="ms-unit">건</span></div>
      <div class="ms-sub">이번 달 등록 업무</div>
      <div class="ms-progress" style="--p:${pct}"><span>${pct}%</span></div>
    </div>
    <div class="ms-card done">
      <div class="ms-label">완료</div>
      <div class="ms-value"><strong>${counts.done}</strong><span class="ms-unit">건</span></div>
      <div class="ms-sub">${counts.total > 0 ? Math.round(counts.done/counts.total*100) : 0}% 달성</div>
    </div>
    <div class="ms-card prog">
      <div class="ms-label">진행중</div>
      <div class="ms-value"><strong>${counts.in_progress}</strong><span class="ms-unit">건</span></div>
      <div class="ms-sub">처리 중인 업무</div>
    </div>
    <div class="ms-card delay">
      <div class="ms-label">지연</div>
      <div class="ms-value"><strong>${counts.delayed}</strong><span class="ms-unit">건</span></div>
      <div class="ms-sub">기한 초과 업무</div>
    </div>
    <div class="ms-card pend">
      <div class="ms-label">대기</div>
      <div class="ms-value"><strong>${counts.pending}</strong><span class="ms-unit">건</span></div>
      <div class="ms-sub">아직 미착수</div>
    </div>`;
}

// ── 캘린더 ───────────────────────────────────────────────────
async function loadCalendar() {
  document.getElementById("cal-body").innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    state.calData = await api.get(`/api/calendar/${state.year}/${state.month}`);
    renderCalendar();
  } catch(e) {
    document.getElementById("cal-body").innerHTML = `<div class="empty">데이터 로드 실패: ${e.message}</div>`;
  }
}

function renderCalendar() {
  const { year, month, events, tasks } = state.calData || {};
  if (!events) return;

  document.getElementById("cal-title").textContent = `${year}년 ${MONTH_KO[month]}`;
  renderDailyPanel(tasks);
  renderMonthSummary(events, tasks);

  const firstWd = (new Date(year, month - 1, 1).getDay() + 6) % 7;
  const lastDay = new Date(year, month, 0).getDate();
  const today = new Date();
  const isCurrentMonth = today.getFullYear() === year && today.getMonth() + 1 === month;

  let html = "";
  // 토(5)/일(6) 시작이면 빈칸 없이 다음 주 월요일부터
  const leadingEmpty = firstWd < 5 ? firstWd : 0;
  for (let i = 0; i < leadingEmpty; i++) html += '<div class="cal-cell empty"></div>';

  for (let d = 1; d <= lastDay; d++) {
    const ds = `${year}-${String(month).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const dow = (new Date(year, month - 1, d).getDay() + 6) % 7;
    if (dow >= 5) continue; // 토/일 건너뜀
    const isToday = isCurrentMonth && today.getDate() === d;

    // 매일 업무는 패널로 분리 → 셀에서 제외
    const rawEvts = (events[ds] || []).filter(e => {
      const t = tasks[e.task_id];
      if (!t) return false;
      if (t.주기 === "매일") return false;
      const f = state.filters;
      if (f.파트 && t.파트 !== f.파트) return false;
      if (f.주기 && t.주기 !== f.주기) return false;
      if (f.구분 && t.구분 !== f.구분) return false;
      if (f.주인 && t.주인 !== f.주인) return false;
      return true;
    });

    // 항목 많으면 2단 (더보기 없이 전부 표시)
    const twoCol = rawEvts.length >= 4;

    // Compute status counts for day stripe
    const sc = { done:0, in_progress:0, delayed:0, pending:0, skipped:0 };
    for (const ev of rawEvts) sc[ev.status || "pending"] = (sc[ev.status || "pending"] || 0) + 1;
    const stripeSegs = rawEvts.length > 0 ? [
      sc.done        > 0 ? `<i class="s-done" style="flex:${sc.done}"></i>` : "",
      sc.in_progress > 0 ? `<i class="s-prog" style="flex:${sc.in_progress}"></i>` : "",
      sc.delayed     > 0 ? `<i class="s-del"  style="flex:${sc.delayed}"></i>` : "",
      sc.pending     > 0 ? `<i class="s-pen"  style="flex:${sc.pending}"></i>` : "",
      sc.skipped     > 0 ? `<i class="s-skp"  style="flex:${sc.skipped}"></i>` : "",
    ].join("") : "";

    html += `<div class="cal-cell${isToday?" today":""}" data-date="${ds}">`;
    if (rawEvts.length > 0) {
      html += `<div class="day-stripe">${stripeSegs}</div>`;
      html += `<div class="cell-count">${rawEvts.length}</div>`;
    }
    html += `<div class="day-num">${d}</div>`;
    html += `<div class="day-events${twoCol?" two-col":""}">`;

    for (const ev of rawEvts) {
      const t = tasks[ev.task_id];
      const cc = chipClass(t);
      const tag = catTag(t);
      const dot = sdot(ev.status);
      const statusCls = ev.status === "done" ? " chip-done"
                      : ev.status === "in_progress" ? " chip-progress"
                      : ev.status === "delayed" ? " chip-delayed" : "";
      const titleText = `[${t?.구분||""}] ${t?.업무||""}`;
      html += `<div class="task-chip ${cc}${statusCls}"
        data-task="${ev.task_id}" data-pk="${escHtml(ev.period_key)}"
        title="${escHtml(titleText)}">
        ${tag}<span class="chip-text">${escHtml(t?.업무||"")}</span>${dot}</div>`;
    }
    html += `</div></div>`;
  }

  document.getElementById("cal-body").innerHTML = html;

  document.querySelectorAll(".task-chip[data-task]").forEach(el => {
    el.addEventListener("click", e => {
      e.stopPropagation();
      openModal(+el.dataset.task, el.dataset.pk);
    });
  });

  // 날짜 셀 클릭 → 사이드 패널
  document.querySelectorAll(".cal-cell:not(.empty)").forEach(cell => {
    cell.addEventListener("click", e => {
      if (e.target.closest(".task-chip")) return;
      const ds = cell.dataset.date;
      if (!ds) return;
      const evts = (state.calData?.events?.[ds] || []).filter(ev => {
        const t = state.calData?.tasks?.[ev.task_id];
        if (!t || t.주기 === "매일") return false;
        const f = state.filters;
        if (f.파트 && t.파트 !== f.파트) return false;
        if (f.주기 && t.주기 !== f.주기) return false;
        if (f.구분 && t.구분 !== f.구분) return false;
        if (f.주인 && t.주인 !== f.주인) return false;
        return true;
      });
      renderSidePanel(ds, evts);
      document.querySelectorAll(".cal-cell.selected").forEach(c => c.classList.remove("selected"));
      cell.classList.add("selected");
    });
  });

  // 오늘(또는 이번 달 첫 영업일) 자동 선택
  const todayCell = document.querySelector(".cal-cell.today");
  const firstCell = document.querySelector(".cal-cell:not(.empty)");
  const autoCell = todayCell || firstCell;
  if (autoCell) {
    autoCell.classList.add("selected");
    const ds = autoCell.dataset.date;
    if (ds) {
      const evts = (state.calData?.events?.[ds] || []).filter(ev => {
        const t = state.calData?.tasks?.[ev.task_id];
        if (!t || t.주기 === "매일") return false;
        const f = state.filters;
        if (f.파트 && t.파트 !== f.파트) return false;
        if (f.주기 && t.주기 !== f.주기) return false;
        if (f.구분 && t.구분 !== f.구분) return false;
        if (f.주인 && t.주인 !== f.주인) return false;
        return true;
      });
      renderSidePanel(ds, evts);
    }
  }
}

// ── 날짜 사이드 패널 ─────────────────────────────────────────
function renderSidePanel(ds, evts) {
  const tasks = state.calData?.tasks || {};
  const [y, m, d] = ds.split("-");
  const dow = ["일","월","화","수","목","금","토"][new Date(+y, +m-1, +d).getDay()];
  const today = new Date(); today.setHours(0,0,0,0);
  const selDate = new Date(+y, +m-1, +d);
  const diffDays = Math.round((selDate - today) / 86400000);
  let relLabel;
  if (diffDays === 0) relLabel = "오늘";
  else if (diffDays > 0) relLabel = `D+${diffDays}`;
  else relLabel = `D${diffDays}`;

  document.getElementById("day-side-title").innerHTML =
    `<span class="day-side-day-num">${+d}</span>${+m}월 ${+d}일 (${dow})<span class="day-side-rel">${relLabel}</span>`;
  document.getElementById("day-side-sub").textContent = `${evts.length}건의 업무`;

  // Status meta pills
  const metaEl = document.getElementById("day-side-meta");
  if (metaEl) {
    if (evts.length > 0) {
      const sc = { done: 0, in_progress: 0, delayed: 0, pending: 0 };
      for (const ev of evts) {
        const s = ev.status || "pending";
        if (s in sc) sc[s]++;
      }
      metaEl.style.display = "";
      metaEl.innerHTML = `
        <div class="pill"><span class="sdot sdot-done"></span>완료 <b>${sc.done}</b></div>
        <div class="pill"><span class="sdot sdot-in_progress"></span>진행중 <b>${sc.in_progress}</b></div>
        <div class="pill"><span class="sdot sdot-delayed"></span>지연 <b>${sc.delayed}</b></div>
        <div class="pill"><span class="sdot sdot-pending"></span>대기 <b>${sc.pending}</b></div>`;
    } else {
      metaEl.style.display = "none";
    }
  }

  const body = document.getElementById("day-side-body");
  if (!evts.length) {
    body.innerHTML = '<div class="day-side-empty">업무 없음</div>';
    return;
  }
  body.innerHTML = evts.map(ev => {
    const t = tasks[ev.task_id];
    const cc = chipClass(t);
    const dot = sdot(ev.status);
    const statusCls = ev.status === "done" ? " chip-done"
                    : ev.status === "in_progress" ? " chip-progress"
                    : ev.status === "delayed" ? " chip-delayed" : "";
    const ownerTxt = t?.주인 ? `<span style="font-size:10px;opacity:.6;margin-left:4px;">${escHtml(t.주인)}</span>` : "";
    return `<div class="task-chip ${cc}${statusCls}"
      style="padding:5px 7px;font-size:11.5px;"
      data-task="${ev.task_id}" data-pk="${escHtml(ev.period_key)}">
      ${catTag(t)}<span class="chip-text">${escHtml(t?.업무||"")}</span>${ownerTxt}${dot}
    </div>`;
  }).join("");

  body.querySelectorAll(".task-chip[data-task]").forEach(el => {
    el.addEventListener("click", () => openModal(+el.dataset.task, el.dataset.pk));
  });
}

// ── 매일 업무 패널 ───────────────────────────────────────────
function renderDailyPanel(tasks) {
  const dailyTasks = Object.values(tasks).filter(t => t.주기 === "매일");
  const panel = document.getElementById("daily-panel");
  const body  = document.getElementById("daily-panel-body");
  const cnt   = document.getElementById("daily-panel-cnt");

  if (!dailyTasks.length) { panel.style.display = "none"; return; }
  panel.style.display = "";
  cnt.textContent = `${dailyTasks.length}건`;

  body.innerHTML = dailyTasks.map(t => {
    const cc  = chipClass(t);
    const tag = catTag(t);
    const owner = t.주인 ? `<span style="opacity:.6;font-size:10px">· ${escHtml(t.주인)}</span>` : "";
    return `<div class="daily-chip ${cc}" data-task="${t.id}" title="${escHtml(t.업무)}">
      ${tag}<span>${escHtml(t.업무)}</span>${owner}
    </div>`;
  }).join("");

  body.querySelectorAll(".daily-chip").forEach(el => {
    el.addEventListener("click", () => openModal(+el.dataset.task, null));
  });
}

// ── 목록 현황 신호등 ──────────────────────────────────────────
function listStatusHtml(taskId, 주기) {
  const byKey = state.listStatuses[taskId] || {};
  const entries = Object.entries(byKey); // [[period_key, status], ...]

  if (!entries.length) {
    return `<span class="ls-none" title="이번달 일정 없음">—</span>`;
  }

  if (주기 === "매일") {
    const total = entries.length;
    const done  = entries.filter(([,s]) => s === "done").length;
    const cls   = done === total ? "sdot-done"
                : entries.some(([,s]) => s === "delayed")  ? "sdot-delayed"
                : entries.some(([,s]) => s === "in_progress") ? "sdot-progress"
                : done > 0 ? "sdot-done" : "sdot-pending";
    return `<span class="ls-daily ${cls.replace('sdot-','ls-')}">${done}<span style="opacity:.5">/${total}</span></span>`;
  }

  // 매주 / 매월: period_key별 dot 표시
  const dotCls = s => s === "in_progress" ? "sdot-progress" : (s || "pending") === "pending" ? "sdot-pending" : `sdot-${s}`;
  const tip = s => STATUS_LABEL[s] || s;
  return `<span class="ls-dots">${entries.map(([pk, s]) =>
    `<span class="sdot ${dotCls(s)}" title="${escHtml(pk + ': ' + tip(s))}"></span>`
  ).join("")}</span>`;
}

// ── 목록 뷰 ─────────────────────────────────────────────────
async function loadList() {
  try {
    const params = new URLSearchParams();
    for (const [k, v] of Object.entries(state.filters)) if (v) params.set(k, v);
    const [tasks, calData] = await Promise.all([
      api.get(`/api/tasks?${params}`),
      api.get(`/api/calendar/${state.year}/${state.month}`),
    ]);
    state.allTasks = tasks;
    state.listStatuses = {};
    for (const evts of Object.values(calData.events || {})) {
      for (const ev of evts) {
        if (!state.listStatuses[ev.task_id]) state.listStatuses[ev.task_id] = {};
        state.listStatuses[ev.task_id][ev.period_key] = ev.status;
      }
    }
    renderList();
  } catch(e) {
    document.getElementById("list-content").innerHTML = `<div style="padding:20px;color:red;">오류: ${e.message}</div>`;
  }
}

// ── 시기 문자열 → 당월 실제 영업일 계산 ──────────────────────
function resolveSigi(sigi, year, month) {
  if (!sigi) return null;
  const s = sigi.trim();
  const last = new Date(year, month, 0).getDate();
  const wd = d => (new Date(year, month - 1, d).getDay() + 6) % 7; // 0=월…4=금, 5=토, 6=일

  const firstBiz = () => { let d = 1; while (wd(d) >= 5) d++; return d; };
  const lastBiz  = () => { let d = last; while (wd(d) >= 5) d--; return d; };
  const toBiz    = n => {
    const d = Math.min(Math.max(n, 1), last);
    const w = wd(d);
    if (w === 5) { const n2 = d + 2; return n2 <= last ? n2 : d - 1; }
    if (w === 6) { const n2 = d + 1; return n2 <= last ? n2 : d - 2; }
    return d;
  };
  const nthOf = (n, targetWd) => {
    let c = 0;
    for (let d = 1; d <= last; d++) if (wd(d) === targetWd) { c++; if (c === n) return d; }
    return 0;
  };
  const WD = { "월": 0, "화": 1, "수": 2, "목": 3, "금": 4 };

  // 월말 / 말일 / 당월 말일
  if (s.includes("말일") || s.includes("월말") || s.includes("당월 말")) return [lastBiz()];
  // 첫 영업일
  if (s.includes("첫 영업일") || s.includes("첫영업일") || s.includes("매월 첫") || s.includes("첫째주") || s.includes("월초")) return [firstBiz()];
  // 결산
  if (s.includes("결산")) return [toBiz(25)];
  // 중순~말
  if (s.includes("중순~말")) return [toBiz(20)];
  // 중순
  if (s.includes("중순")) return [toBiz(15)];
  // 월 2회
  if (s.includes("월 2회") || s.includes("월2회")) return [toBiz(10), toBiz(25)];
  // N/M주차 요일 (예: '2/4주차 목요일')
  const m1 = s.match(/(\d)\/(\d)주차\s*([월화수목금])/);
  if (m1) return [nthOf(+m1[1], WD[m1[3]]), nthOf(+m1[2], WD[m1[3]])].filter(Boolean);
  // 복합 콤마 (예: '3주차 월요일, 4주차 금요일') — 최대 2개
  if (s.includes(",")) {
    const parts = s.split(",").map(p => p.trim());
    const days = [];
    for (const p of parts) {
      const m = p.match(/(\d)주차\s*([월화수목금])/);
      if (m) { const d = nthOf(+m[1], WD[m[2]]); if (d) days.push(d); }
    }
    if (days.length) return days;
  }
  // N주차 요일
  const m2 = s.match(/(\d)주차\s*([월화수목금])/);
  if (m2) { const d = nthOf(+m2[1], WD[m2[2]]); return d ? [d] : null; }
  // N주차 단독
  const m3 = s.match(/(\d)주차/);
  if (m3) { const d = nthOf(+m3[1], 0); return d ? [d] : null; }
  // N일
  const m4 = s.match(/(\d+)일/);
  if (m4) { const n = +m4[1]; if (n >= 1 && n <= 31) return [toBiz(n)]; }
  // 수시
  if (s.includes("수시")) return [firstBiz()];

  return null;
}

const DOW_KO = ["일", "월", "화", "수", "목", "금", "토"];
function fmtResolvedDays(days, year, month) {
  if (!days || !days.length) return "";
  return days.map(d => {
    const dow = DOW_KO[new Date(year, month - 1, d).getDay()];
    return `<span class="sigi-date">${month}/${d}(${dow})</span>`;
  }).join(" ");
}

function renderList() {
  const CYCLE_ORDER = { "매일": 0, "매주": 1, "매월": 2 };
  const PARTS = ["SCM쉐어드파트", "수출입파트"];
  const partConf = {
    "SCM쉐어드파트": { short: "SCM",  color: "scm", mainCss: "--scm-main", lightCss: "--scm-light", borderCss: "--scm-border" },
    "수출입파트":    { short: "수출입", color: "exp", mainCss: "--exp-main", lightCss: "--exp-light", borderCss: "--exp-border" },
  };

  // Base filter (from filter bar)
  const baseFiltered = state.allTasks.filter(t => {
    const f = state.filters;
    if (f.파트 && t.파트 !== f.파트) return false;
    if (f.주기 && t.주기 !== f.주기) return false;
    if (f.구분 && t.구분 !== f.구분) return false;
    if (f.주인 && t.주인 !== f.주인) return false;
    return true;
  });

  // Cycle counts (from base filtered, before search/cycle tab)
  const cycleCounts = { 매일: 0, 매주: 0, 매월: 0 };
  for (const t of baseFiltered) cycleCounts[t.주기] = (cycleCounts[t.주기] || 0) + 1;

  // Apply search
  const sq = (state.listSearch || "").trim().toLowerCase();
  let tasks = sq ? baseFiltered.filter(t =>
    (t.업무 || "").toLowerCase().includes(sq) ||
    (t.주인 || "").toLowerCase().includes(sq) ||
    (t.구분 || "").toLowerCase().includes(sq) ||
    (t.output || "").toLowerCase().includes(sq) ||
    (t.시기_마감 || "").toLowerCase().includes(sq)
  ) : baseFiltered;

  // Apply cycle filter
  const cf = state.listCycleFilter || "all";
  if (cf !== "all") tasks = tasks.filter(t => t.주기 === cf);

  const container = document.getElementById("list-content");

  // Sort
  const sortGroup = arr => [...arr].sort((a, b) => {
    const co = (CYCLE_ORDER[a.주기] ?? 99) - (CYCLE_ORDER[b.주기] ?? 99);
    if (co !== 0) return co;
    if (state.sortCol) {
      const av = a[state.sortCol] || "", bv = b[state.sortCol] || "";
      return av.localeCompare(bv, "ko") * state.sortDir;
    }
    return 0;
  });

  // Get best status for a task in this month
  const statusOfTask = t => {
    if (t.주기 === "매일") return null;
    const byKey = state.listStatuses[t.id] || {};
    const entries = Object.entries(byKey);
    if (!entries.length) return "pending";
    const pri = { delayed: 0, in_progress: 1, pending: 2, skipped: 3, done: 4 };
    return entries.sort((a, b) => (pri[a[1]] ?? 99) - (pri[b[1]] ?? 99))[0][1];
  };

  const si = col => state.sortCol === col ? (state.sortDir === 1 ? " active sort-asc" : " active sort-desc") : "";

  // 시기/마감 셀: 텍스트 + 당월 실제 영업일 배지
  const sigiCell = t => {
    if (!t.시기_마감) return '<span class="td-dash">—</span>';
    let html = escHtml(t.시기_마감);
    if (t.주기 === "매월") {
      const days = resolveSigi(t.시기_마감, state.year, state.month);
      if (days && days.length) html += "<br>" + fmtResolvedDays(days, state.year, state.month);
    }
    return html;
  };

  const makePanel = partKey => {
    const conf = partConf[partKey];
    const partTasks = tasks.filter(t => t.파트 === partKey);
    const sorted = sortGroup(partTasks);
    const dailyN   = partTasks.filter(t => t.주기 === "매일").length;
    const weeklyN  = partTasks.filter(t => t.주기 === "매주").length;
    const monthlyN = partTasks.filter(t => t.주기 === "매월").length;

    const rows = sorted.map(t => {
      const status = statusOfTask(t);
      const 구분Html = t.구분 ? `<span class="cat-pill">${escHtml(t.구분)}</span>` : `<span class="td-dash">—</span>`;
      const noteHtml = (t.비고 || t.output) ? `<div class="td-task-note">${
        t.output ? `<span class="td-output-inline">Output: ${escHtml(t.output)}</span>` : ""
      }${t.output && t.비고 ? `<span style="margin:0 4px;opacity:.4">·</span>` : ""}${t.비고 ? escHtml(t.비고) : ""}</div>` : "";
      const statusHtml = status
        ? `<span class="status-pill s-${status}">${sdot(status)}${STATUS_LABEL[status] || status}</span>`
        : `<span class="td-dash">—</span>`;
      const byKey = state.listStatuses[t.id] || {};
      const keys = Object.keys(byKey);
      const pk = t.주기 === "매월"
        ? `${state.year}-${String(state.month).padStart(2,"0")}`
        : (keys.length ? keys[keys.length - 1] : `${state.year}-${String(state.month).padStart(2,"0")}-14`);
      return `<tr class="data-row" data-id="${t.id}" data-pk="${escHtml(pk)}">
        <td><span class="badge badge-${t.주기==="매일"?"daily":t.주기==="매주"?"weekly":"monthly"}">${escHtml(t.주기||"")}</span></td>
        <td class="td-cat">${구분Html}</td>
        <td class="td-task"><div class="td-task-name">${escHtml(t.업무)}</div>${noteHtml}</td>
        <td class="td-owner">${t.주인 ? escHtml(t.주인) : '<span class="td-dash">—</span>'}</td>
        <td class="td-sigi">${sigiCell(t)}</td>
        <td class="td-status">${statusHtml}</td>
      </tr>`;
    }).join("");

    return `<div class="part-panel part-${conf.color}">
      <div class="part-panel-hd">
        <span class="part-panel-mark" style="background:var(${conf.lightCss});color:var(${conf.mainCss});border:1px solid var(${conf.borderCss})">${conf.short}</span>
        <h3>${escHtml(partKey)}</h3>
        <span class="part-panel-cnt">${partTasks.length}건</span>
        <span class="part-panel-meta">
          <span class="ppc"><span class="badge badge-daily">매일</span>${dailyN}</span>
          <span class="ppc"><span class="badge badge-weekly">매주</span>${weeklyN}</span>
          <span class="ppc"><span class="badge badge-monthly">매월</span>${monthlyN}</span>
        </span>
      </div>
      <div class="list-table-wrap part-table">
        <table>
          <thead><tr>
            <th class="sortable${si("주기")}" data-col="주기" style="width:60px">주기</th>
            <th class="sortable${si("구분")}" data-col="구분" style="width:80px">구분</th>
            <th class="sortable${si("업무")}" data-col="업무">업무</th>
            <th class="sortable${si("주인")}" data-col="주인" style="width:90px">담당자</th>
            <th class="sortable${si("시기_마감")}" data-col="시기_마감" style="width:115px">시기/마감</th>
            <th style="width:100px">상태</th>
          </tr></thead>
          <tbody>${rows || `<tr><td colspan="6" class="td-empty">표시할 업무가 없습니다</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
  };

  const scmCount = tasks.filter(t => t.파트 === "SCM쉐어드파트").length;
  const expCount = tasks.filter(t => t.파트 === "수출입파트").length;

  const cycleTabs = [
    ["all",  "전체",  baseFiltered.length, ""],
    ["매일", "매일",  cycleCounts["매일"] || 0, "k-daily"],
    ["매주", "매주",  cycleCounts["매주"] || 0, "k-weekly"],
    ["매월", "매월",  cycleCounts["매월"] || 0, "k-monthly"],
  ].map(([k, label, n, cls]) =>
    `<button class="cycle-tab${cf === k ? " active" : ""}${cls ? " " + cls : ""}" data-cycle="${k}">
      <span>${label}</span><span class="cycle-count">${n}</span>
    </button>`
  ).join("") +
  `<span class="cycle-tabs-sep"></span>
   <span class="cycle-tabs-meta">SCM쉐어드 <b>${scmCount}</b>건 · 수출입 <b>${expCount}</b>건</span>`;

  container.innerHTML = `
    <div class="list-toolbar">
      <div class="list-toolbar-left">
        <h2>업무 목록</h2>
        <span class="list-total">전체 <b>${state.allTasks.length}</b>건 · 표시 <b>${tasks.length}</b>건</span>
      </div>
      <div class="list-toolbar-right">
        <div class="list-search">
          <span class="ls-icon">⌕</span>
          <input type="text" id="list-search-input" placeholder="업무명, 담당자, 구분, Output 검색" value="${escHtml(state.listSearch || "")}">
          ${state.listSearch ? `<button class="ls-clear" id="ls-clear-btn">✕</button>` : ""}
        </div>
        <button class="btn-add" id="list-btn-add">＋ 업무 추가</button>
      </div>
    </div>
    <div class="cycle-tabs">${cycleTabs}</div>
    <div class="parts-grid">${PARTS.map(makePanel).join("")}</div>
    ${tasks.length === 0 ? `<div class="list-empty-state">검색 결과가 없습니다.
      <button class="btn-cancel" style="margin-left:10px" id="list-reset-btn">초기화</button></div>` : ""}`;

  // Search input
  const searchInput = document.getElementById("list-search-input");
  if (searchInput) {
    searchInput.addEventListener("input", e => { state.listSearch = e.target.value; renderList(); });
    // Restore caret position
    searchInput.focus();
    const v = searchInput.value;
    searchInput.value = "";
    searchInput.value = v;
    searchInput.blur();
  }
  const clearBtn = document.getElementById("ls-clear-btn");
  if (clearBtn) clearBtn.addEventListener("click", () => { state.listSearch = ""; renderList(); });
  const resetBtn = document.getElementById("list-reset-btn");
  if (resetBtn) resetBtn.addEventListener("click", () => { state.listSearch = ""; state.listCycleFilter = "all"; renderList(); });

  // Add task
  const addBtn = document.getElementById("list-btn-add");
  if (addBtn) addBtn.addEventListener("click", openTaskForm);

  // Cycle tabs
  container.querySelectorAll(".cycle-tab[data-cycle]").forEach(btn => {
    btn.addEventListener("click", () => { state.listCycleFilter = btn.dataset.cycle; renderList(); });
  });

  // Row click
  container.querySelectorAll("tr.data-row").forEach(row => {
    row.addEventListener("click", () => openModal(+row.dataset.id, row.dataset.pk || null));
  });

  // Sort
  container.querySelectorAll("th.sortable[data-col]").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.col;
      if (state.sortCol === col) state.sortDir *= -1;
      else { state.sortCol = col; state.sortDir = 1; }
      renderList();
    });
  });
}

// ── 통계 뷰 ─────────────────────────────────────────────────
async function loadStats() {
  try {
    const data = await api.get("/api/stats");

    document.getElementById("stats-cards").innerHTML = `
      <div class="stat-card">
        <div class="stat-val">${data.total}</div>
        <div class="stat-lbl">전체 업무</div>
      </div>
      ${Object.entries(data.by_part).map(([k,v]) => `
        <div class="stat-card">
          <div class="stat-val">${v}</div>
          <div class="stat-lbl">${k}</div>
        </div>`).join("")}`;

    const colors = { "매일":"#F59E0B","매주":"#10B981","매월":"#6366F1" };
    const maxCycle = Math.max(...Object.values(data.by_cycle));
    const maxCat   = Math.max(...Object.values(data.by_category));
    const maxOwner = Math.max(...Object.values(data.by_owner));

    function bars(obj, max, colorFn) {
      return Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `
        <div class="bar-row">
          <div class="bar-label">${escHtml(k)}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${Math.round(v/max*100)}%;background:${colorFn(k)}">${v}</div>
          </div>
          <div class="bar-count">${v}</div>
        </div>`).join("");
    }

    document.getElementById("stats-charts").innerHTML = `
      <div class="stats-section">
        <h3>주기별 업무</h3>
        ${bars(data.by_cycle, maxCycle, k => colors[k] || "#94A3B8")}
      </div>
      <div class="stats-section">
        <h3>구분별 업무</h3>
        ${bars(data.by_category, maxCat, () => "#818CF8")}
      </div>
      <div class="stats-section">
        <h3>담당자별 업무</h3>
        ${bars(data.by_owner, maxOwner, () => "#22D3EE")}
      </div>
      <div class="stats-section">
        <h3>최근 처리 이력</h3>
        ${(data.recent_logs||[]).length ? data.recent_logs.map(l => `
          <div class="log-item">
            ${statusBadge(l.status)}
            <div class="log-memo">${escHtml(l.memo||"")}</div>
            <div class="log-date">${fmtDate(l.logged_at)}</div>
          </div>`).join("") : '<div class="empty">이력 없음</div>'}
      </div>`;
  } catch(e) {
    document.getElementById("stats-cards").innerHTML = `오류: ${e.message}`;
  }
}

// ── 모달 ─────────────────────────────────────────────────────
async function openModal(taskId, periodKey) {
  state.modal = { taskId, periodKey, selectedStatus: null };

  const overlay = document.getElementById("modal-overlay");
  overlay.classList.remove("hidden");

  const task = (state.calData?.tasks || {})[taskId]
             || state.allTasks.find(t => t.id === taskId);
  if (task) renderModalInfo(task, periodKey);

  try {
    const [fresh, logs] = await Promise.all([
      api.get(`/api/tasks/${taskId}`),
      api.get(`/api/tasks/${taskId}/logs`),
    ]);
    renderModalInfo(fresh, periodKey);
    renderLogs(logs);
    if (state.calData?.tasks) state.calData.tasks[taskId] = fresh;
  } catch(e) {
    console.error(e);
  }
}

function renderModalInfo(task, periodKey) {
  document.getElementById("modal-title").textContent = task.업무;

  // ③ 주차 표기
  const pkDisplay = fmtPeriodKey(periodKey, task.주기);

  document.getElementById("modal-meta").innerHTML =
    `${badgePart(task)} ${badgeCycle(task.주기||"")}` +
    (periodKey ? ` <span style="font-size:11px;color:var(--text-muted);">${escHtml(pkDisplay)}</span>` : "");

  document.getElementById("modal-info").innerHTML = `
    <div class="info-item"><div class="lbl">파트</div><div class="val">${escHtml(task.파트||"-")}</div></div>
    <div class="info-item"><div class="lbl">구분</div><div class="val">${escHtml(task.구분||"-")}</div></div>
    <div class="info-item"><div class="lbl">담당자</div><div class="val">${escHtml(task.주인||"-")}</div></div>
    <div class="info-item"><div class="lbl">시기/마감</div><div class="val">${escHtml(task.시기_마감||"-")}</div></div>
    <div class="info-item full"><div class="lbl">Output</div><div class="val">${escHtml(task.output||"-")}</div></div>
    ${task.비고 ? `<div class="info-item full"><div class="lbl">비고</div><div class="val">${escHtml(task.비고)}</div></div>` : ""}`;

  document.getElementById("memo-input").value = "";
  document.querySelectorAll(".status-btn").forEach(b => b.classList.remove("active"));
  if (periodKey) {
    state.modal.periodKey = periodKey;
    document.getElementById("save-log-btn").disabled = false;
  } else {
    document.getElementById("save-log-btn").disabled = true;
  }
}

function renderLogs(logs) {
  const container = document.getElementById("log-list");
  if (!logs.length) { container.innerHTML = '<div class="empty">이력 없음</div>'; return; }
  container.innerHTML = logs.map(l => `
    <div class="log-item" data-lid="${l.id}">
      ${statusBadge(l.status)}
      <div class="log-memo">${escHtml(l.memo || "메모 없음")}</div>
      <div class="log-date">${fmtDate(l.logged_at)}</div>
      <button class="log-del" data-lid="${l.id}" title="삭제">✕</button>
    </div>`).join("");

  container.querySelectorAll(".log-del").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm("이 이력을 삭제할까요?")) return;
      await api.del(`/api/task_logs/${btn.dataset.lid}`);
      const logs2 = await api.get(`/api/tasks/${state.modal.taskId}/logs`);
      renderLogs(logs2);
      await reloadCalData();
    });
  });
}

function closeModal() {
  document.getElementById("modal-overlay").classList.add("hidden");
  state.modal = { taskId: null, periodKey: null, selectedStatus: null };
}

// ── 날짜 팝업 ────────────────────────────────────────────────
function openDayPopup(ds, evts, anchorEl) {
  const tasks = state.calData?.tasks || {};
  const [, m, d] = ds.split("-");
  document.getElementById("day-popup-title").textContent = `${+m}월 ${+d}일 업무 전체`;

  const list = document.getElementById("day-popup-list");
  list.innerHTML = evts.map(ev => {
    const t = tasks[ev.task_id];
    const cc = chipClass(t);
    const tag = catTag(t);
    const dot = sdot(ev.status);
    const statusCls = ev.status === "done" ? " chip-done"
                    : ev.status === "in_progress" ? " chip-progress"
                    : ev.status === "delayed" ? " chip-delayed" : "";
    return `<div class="task-chip ${cc}${statusCls}"
      style="padding:6px 8px;font-size:12px;"
      data-task="${ev.task_id}" data-pk="${escHtml(ev.period_key)}">
      ${tag}<span class="chip-text">${escHtml(t?.업무||"")}</span>${dot}
    </div>`;
  }).join("");

  list.querySelectorAll(".task-chip[data-task]").forEach(el => {
    el.addEventListener("click", () => {
      closeDayPopup();
      openModal(+el.dataset.task, el.dataset.pk);
    });
  });

  const popup = document.getElementById("day-popup");
  const rect = anchorEl.getBoundingClientRect();
  const popupW = 300;
  let left = rect.left;
  if (left + popupW > window.innerWidth - 8) left = window.innerWidth - popupW - 8;
  if (left < 8) left = 8;
  popup.style.left = `${left}px`;
  popup.style.top  = `${rect.bottom + 4}px`;

  document.getElementById("day-popup-overlay").classList.remove("hidden");

  requestAnimationFrame(() => {
    const pr = popup.getBoundingClientRect();
    if (pr.bottom > window.innerHeight - 8) {
      const newTop = rect.top - pr.height - 4;
      popup.style.top = `${Math.max(8, newTop)}px`;
    }
  });
}

function closeDayPopup() {
  document.getElementById("day-popup-overlay").classList.add("hidden");
}

async function reloadCalData() {
  if (state.view === "list") {
    await loadList();
    return;
  }
  if (state.view === "calendar" && state.calData) {
    state.calData = await api.get(`/api/calendar/${state.year}/${state.month}`);
    renderCalendar();
    // 선택된 날짜 사이드 패널 갱신
    const sel = document.querySelector(".cal-cell.selected");
    if (sel?.dataset?.date) {
      const ds = sel.dataset.date;
      const evts = (state.calData?.events?.[ds] || []).filter(ev => {
        const t = state.calData?.tasks?.[ev.task_id];
        return t && t.주기 !== "매일";
      });
      renderSidePanel(ds, evts);
    }
  }
}

// ── ⑤ 업무 추가 모달 ─────────────────────────────────────────
const PRESETS = {
  주간보고: { 주기: "매주", 구분: "보고", 업무: "주간보고", 시기: "매주 금요일", output: "주간보고서" },
  월간보고: { 주기: "매월", 구분: "보고", 업무: "월간보고", 시기: "월말", output: "월간보고서" },
  매일재고: { 주기: "매일", 구분: "재고", 업무: "매일 재고 현황 확인", 시기: "매일", output: "재고현황표" },
};

function openTaskForm() {
  clearTaskForm();
  document.getElementById("task-form-overlay").classList.remove("hidden");
}
function closeTaskForm() {
  document.getElementById("task-form-overlay").classList.add("hidden");
}
function clearTaskForm() {
  ["tf-파트","tf-주기","tf-구분","tf-주인","tf-업무","tf-시기","tf-output","tf-비고"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });
}
function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  if (p.주기) document.getElementById("tf-주기").value = p.주기;
  if (p.구분) document.getElementById("tf-구분").value = p.구분;
  if (p.업무) document.getElementById("tf-업무").value = p.업무;
  if (p.시기) document.getElementById("tf-시기").value = p.시기;
  if (p.output) document.getElementById("tf-output").value = p.output;
}

async function submitTaskForm() {
  const 파트 = document.getElementById("tf-파트").value.trim();
  const 주기 = document.getElementById("tf-주기").value.trim();
  const 업무 = document.getElementById("tf-업무").value.trim();
  if (!파트 || !주기 || !업무) {
    alert("파트, 주기, 업무명은 필수입니다.");
    return;
  }
  const body = {
    파트, 주기, 업무,
    구분: document.getElementById("tf-구분").value.trim() || null,
    주인: document.getElementById("tf-주인").value.trim() || null,
    시기_마감: document.getElementById("tf-시기").value.trim() || null,
    output: document.getElementById("tf-output").value.trim() || null,
    비고: document.getElementById("tf-비고").value.trim() || null,
  };
  Object.keys(body).forEach(k => body[k] === null && delete body[k]);

  const btn = document.getElementById("task-form-submit");
  btn.disabled = true; btn.textContent = "추가 중...";
  try {
    await api.post("/api/tasks", body);
    closeTaskForm();
    await loadList();
    state.calData = null;
    if (state.view === "calendar") await loadCalendar();
  } catch(e) {
    alert("추가 실패: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = "추가하기";
  }
}

// ── 이벤트 바인딩 ────────────────────────────────────────────
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", async () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    state.view = tab.dataset.view;

    document.getElementById("calendar-view").style.display = state.view === "calendar" ? "" : "none";
    document.getElementById("list-view").style.display     = state.view === "list"     ? "" : "none";

    if (state.view === "calendar" && !state.calData) await loadCalendar();
    if (state.view === "list")  await loadList();
  });
});

document.getElementById("prev-month").addEventListener("click", async () => {
  if (state.month === 1) { state.year--; state.month = 12; }
  else state.month--;
  state.calData = null;
  await loadCalendar();
});
document.getElementById("next-month").addEventListener("click", async () => {
  if (state.month === 12) { state.year++; state.month = 1; }
  else state.month++;
  state.calData = null;
  await loadCalendar();
});
document.getElementById("today-btn").addEventListener("click", async () => {
  state.year = new Date().getFullYear();
  state.month = new Date().getMonth() + 1;
  state.calData = null;
  await loadCalendar();
});

document.getElementById("btn-reset").addEventListener("click", () => {
  state.filters = { 파트: "", 주기: "", 구분: "", 주인: "" };
  document.querySelectorAll(".filter-select").forEach(s => { s.value = ""; s.classList.remove("is-active"); });
  onFilterChange();
});

document.getElementById("modal-close").addEventListener("click", closeModal);
document.getElementById("modal-overlay").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeModal();
});
document.getElementById("day-popup-close").addEventListener("click", closeDayPopup);
document.getElementById("day-popup-overlay").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeDayPopup();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeModal(); closeDayPopup(); closeTaskForm(); }
});

document.querySelectorAll(".status-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    state.modal.selectedStatus = btn.dataset.status;
    document.querySelectorAll(".status-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  });
});

document.getElementById("save-log-btn").addEventListener("click", async () => {
  const { taskId, periodKey, selectedStatus } = state.modal;
  if (!taskId || !periodKey) return;
  const status = selectedStatus || "done";
  const memo   = document.getElementById("memo-input").value.trim();

  const btn = document.getElementById("save-log-btn");
  btn.disabled = true; btn.textContent = "저장 중...";
  try {
    await api.post(`/api/tasks/${taskId}/logs`, { period_key: periodKey, status, memo });
    const logs = await api.get(`/api/tasks/${taskId}/logs`);
    renderLogs(logs);
    await reloadCalData();
    document.getElementById("memo-input").value = "";
    document.querySelectorAll(".status-btn").forEach(b => b.classList.remove("active"));
    state.modal.selectedStatus = null;
  } catch(e) {
    alert("저장 실패: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = "저장";
  }
});

// 매일 패널 토글
document.getElementById("daily-panel-toggle").addEventListener("click", () => {
  const body = document.getElementById("daily-panel-body");
  const btn  = document.getElementById("daily-panel-toggle");
  const collapsed = body.classList.toggle("collapsed");
  btn.textContent = collapsed ? "펼치기 ▼" : "접기 ▲";
});

// FAB + 업무 추가 모달 이벤트
document.getElementById("fab-add").addEventListener("click", openTaskForm);
document.getElementById("task-form-close").addEventListener("click", closeTaskForm);
document.getElementById("task-form-cancel").addEventListener("click", closeTaskForm);
document.getElementById("task-form-overlay").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeTaskForm();
});
document.getElementById("task-form-submit").addEventListener("click", submitTaskForm);

document.querySelectorAll(".preset-btn").forEach(btn => {
  btn.addEventListener("click", () => applyPreset(btn.dataset.preset));
});

// ── 인트로 스플래시 ──────────────────────────────────────────
(function() {
  const splash = document.getElementById("intro-splash");
  if (!splash) return;
  const now = new Date();
  const dateEl = document.getElementById("splash-date");
  if (dateEl) dateEl.textContent = `${now.getFullYear()} · ${String(now.getMonth()+1).padStart(2,"0")}`;
  const cleanup = () => splash.classList.add("is-gone");
  setTimeout(cleanup, 4500);
  splash.addEventListener("click", () => {
    splash.style.animation = "intro-fade-out .35s ease forwards";
    setTimeout(cleanup, 400);
  });
})();

// ── 초기 로드 ────────────────────────────────────────────────
(async () => {
  await initFilters();
  await loadCalendar();
})();
</script>
</body>
